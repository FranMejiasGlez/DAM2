<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="ActividadB1S4.css" />
    <title>Calculadora</title>
  </head>

  <body>
    <div class="calculator">
      <input class="display" type="text" id="display" readonly style="font-size: large" />

      <table class="calc-table">
        <tr>
          <td>
            <button class="button" onclick="construirNumero('1')">1</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('2')">2</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('3')">3</button>
          </td>
          <td><button class="button" onclick="intercambio('+')">+</button></td>
        </tr>
        <tr>
          <td>
            <button class="button" onclick="construirNumero('4')">4</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('5')">5</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('6')">6</button>
          </td>
          <td><button class="button" onclick="intercambio('-')">-</button></td>
        </tr>
        <tr>
          <td>
            <button class="button" onclick="construirNumero('7')">7</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('8')">8</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('9')">9</button>
          </td>
          <td><button class="button" onclick="intercambio('*')">*</button></td>
        </tr>
        <tr>
          <td>
            <button class="button" onclick="construirNumero('0')">0</button>
          </td>
          <td>
            <button class="button" onclick="construirNumero('.')">.</button>
          </td>
          <td><button class="button" onclick="calcular()">=</button></td>
          <td><button class="button" onclick="intercambio('/')">/</button></td>
        </tr>
        <tr>
          <td colspan="4">
            <button style="width: 100%" onclick="limpiar()">C</button>
          </td>
        </tr>
      </table>
    </div>
    <script>
      let numeroActual
      let numeroAnterior
      let resultado
      let simbolo = '+'
      let expresionCompleta = ''

      function construirNumero(numero) {
        const display = document.getElementById('display')

        // Si hay resultado previo, limpiar todo para nueva operación
        if (resultado !== undefined) {
          limpiar()
        }

        // Restricción para punto decimal
        if (numero === '.' && numeroActual && numeroActual.includes('.')) {
          return
        }

        // Si es punto y no hay número actual, empezar con "0."
        if (
          numero === '.' &&
          (numeroActual === undefined || numeroActual === '')
        ) {
          numeroActual = '0.'
          expresionCompleta += '0.'
        }
        // Si es punto y hay número actual sin punto
        else if (numero === '.' && !numeroActual.includes('.')) {
          numeroActual += '.'
          expresionCompleta += '.'
        }
        // Si es dígito normal
        else if (numero !== '.') {
          if (numeroActual === undefined) {
            numeroActual = numero
            expresionCompleta += numero
          } else {
            numeroActual += numero
            expresionCompleta += numero
          }
        }

        // Mostrar la expresión completa
        display.value = expresionCompleta
      }

      function intercambio(operador) {
        const display = document.getElementById('display')

        // Si hay resultado de operación anterior, usarlo como numeroAnterior
        if (resultado !== undefined) {
          numeroAnterior = resultado
          resultado = undefined
          expresionCompleta = numeroAnterior.toString() // ← ESTA ERA LA CLAVE
        }
        // Si hay número actual, convertirlo en anterior
        else if (numeroActual !== undefined) {
          numeroAnterior = parseFloat(numeroActual)
          numeroActual = undefined
        }

        simbolo = operador

        // Agregar operador a la expresión
        if (expresionCompleta !== '' && !expresionCompleta.endsWith(' ')) {
          expresionCompleta += ' ' + operador + ' '
        } else {
          expresionCompleta += operador + ' '
        }

        // Mostrar expresión actualizada
        display.value = expresionCompleta
      }

      function calcular() {
        const display = document.getElementById('display')

        // Validar que tenemos todo para calcular
        if (
          numeroAnterior === undefined ||
          numeroActual === undefined ||
          !simbolo
        ) {
          return
        }

        const num1 = parseFloat(numeroAnterior)
        const num2 = parseFloat(numeroActual)

        // Realizar cálculo
        switch (simbolo) {
          case '+':
            resultado = num1 + num2
            break
          case '-':
            resultado = num1 - num2
            break
          case '*':
            resultado = num1 * num2
            break
          case '/':
            if (num2 === 0) {
              alert('Error: No se puede dividir por cero')
              limpiar()
              return
            }
            resultado = num1 / num2
            break
          default:
            break
        }

        // SOLO MOSTRAR EL RESULTADO (limpiar pantalla)
        display.value = resultado

        // Preparar para siguiente operación
        numeroAnterior = resultado
        numeroActual = undefined
        expresionCompleta = resultado.toString() // Guardar el resultado para continuar operando
      }

      function limpiar() {
        const display = document.getElementById('display')
        numeroActual = undefined
        numeroAnterior = undefined
        resultado = undefined
        simbolo = '+'
        expresionCompleta = ''
        display.value = '0'
      }

      // Inicializar display
      document.getElementById('display').value = '0'
    </script>
  </body>
</html>
