<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="ActividadB1S4.css">
    <title>
        Calculadora
    </title>
</head>

<body>
    <div class="calculator">
        <input class="display" type="text" id="display" readonly>

        <table class="calc-table">
            <tr>
                <td><button class="button" onclick="buildNumber(1)">1</button></td>
                <td><button class="button" onclick="buildNumber(2)">2</button></td>
                <td><button class="button" onclick="buildNumber(3)">3</button></td>
                <td><button class="button" onclick="buildNumber(4)">4</button></td>
            </tr>
            <tr>
                <td><button class="button" onclick="buildNumber(5)">5</button></td>
                <td><button class="button" onclick="buildNumber(6)">6</button></td>
                <td><button class="button" onclick="buildNumber(7)">7</button></td>
                <td><button class="button" onclick="buildNumber(8)">8</button></td>
            </tr>
            <tr>
                <td><button class="button" onclick="buildNumber(9)">9</button></td>
                <td><button class="button" onclick="buildNumber(0)">0</button></td>
                <td><button class="button" onclick="intercambio('*')">*</button></td>
                <td><button class="button" onclick="intercambio('-')">-</button></td>
            </tr>
            <tr>
                <td><button class="button" onclick="intercambio('+')">+</button></td>
                <td><button class="button" onclick="buildNumber('.')">.</button></td>
                <td><button class="button" onclick="calcular()">=</button></td>
                <td><button class="button" onclick="intercambio('/')">/</button></td>
            </tr>
            <tr>
                <td colspan="4"><button style="width:100%" id="C">C</button></td>
            </tr>
        </table>


    </div>
    </div>
    <script>
        let displayValue = '';
        let esSegundoNumero = false;
        let numero1 = 0;
        let numero2 = 0;
        let simbolo = "+";
        let resultado;


        function buildNumber(numero) {
            if (numero2 === 0) {
                numero2 = numero;
            } else {
                numero2 = '' + numero2 + numero;
            }
            pintarDisplay(numero1, simbolo, numero2);
        }
        function intercambio(operador) {
            simbolo = operador;
            calcular()
            numero1 = resultado;
            numero2 = 0;
        }






        function limpiar() {
            numero1 = 0;
            numero2 = 0;
            simbolo = "";
            display.value = '';
        }

        function pintarDisplay(numero1, simbolo, numero2) {
            const display = document.getElementById('display');

            // Clear display first
            display.value = '';

            // Set the complete expression
            if (numero1 === 0) {
                display.value = ` ${numero2}`;
            } else {
                display.value = `${numero1} ${simbolo} ${numero2}`;
            }

        }

        function calcular() {
            numero2 = parseFloat(numero2);
            switch (simbolo) {
                case "+":
                    resultado = numero1 + numero2;
                    break;
                case "-":
                    resultado = numero1 - numero2;
                    break;
                case "*":
                    resultado = numero1 * numero2;
                    break;
                case "/":
                    resultado = numero1 / numero2;
                    break;
                default:
                    break;
            }
            pintarDisplay(numero1, simbolo, numero2);
        }







    </script>
</body>

</html>
