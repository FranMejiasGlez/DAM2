<HTML>
<HEAD>
  <TITLE>Boletín 2 Ejercicio 1</TITLE>
</HEAD>

<BODY bgcolor="#FFFFFF" text="#000000">
<FORM name="form" method="post" action="mailto:a@as.es">
  <P>Formulario de entrada de datos.<BR>
  Este formulario llama a B2Ej1.asp y le pasa los datos de los dos campos 
    de texto.<BR>
  </P>
  <P>
  El primer campo de texto se llama inicio.<BR>
  El segundo campo de texto se llama fin.<BR>
  </P>
  <TABLE border=0 align="center">
  <TR>
    <TD>Inicio Contador: </TD>
    <TD><INPUT type="text" name="inicio" maxlength="3" size="5"></TD>
  </TR> 
  <TR>
    <TD>Fin Contador: </TD>
    <TD><INPUT type="text" name="fin" maxlength="3" size="5"></TD>
  </TR>
  <TR>
    <TD>Incremento: </TD>
    <TD><INPUT type="text" name="incremento" maxlength="3" size="5"></TD>
  </TR>
  <TR>
    <TD colspan=2 align="center"><INPUT type="submit" value="Enviar Datos"></TD>
  </TR>
  </TABLE> 
</FORM>

</BODY>
</HTML>
